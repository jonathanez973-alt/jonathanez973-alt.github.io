<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldTime</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>World<span>Time</span></h1>
    <p>Explore le monde, une heure à la fois</p>
  </header>

  <main>
    <section id="principal">
      <div id="grande-heure"></div>
      <div id="grande-date"></div>
      <div class="ajout">
        <input id="saisie" type="text" placeholder="Rechercher une ville...">
        <button id="btn-ajouter">Rechercher</button>
      </div>
      <p id="message"></p>
    </section>

    <section id="cartes"></section>

    <p class="info">Le fuseau horaire vous permet de comparer l'heure partout dans le monde.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
